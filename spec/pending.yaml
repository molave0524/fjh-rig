resolved:
  - id: RES-SCR-SELECTION
    description: SCR selection finalized
    status: verified
    resolution: WESTCODE N170CH12 W8 puck

  - id: RES-TUBE-SPEC
    description: Quartz tube spec locked
    status: verified
    resolution: 18 mm ID x 21.6 mm OD (Wale Apparatus CFQ18X21.6)

  - id: RES-VAC-GAUGE
    description: Chamber pressure gauge selected
    status: verified
    resolution: MKS 901P-11030 KF (KF-25 direct mount)

  - id: RES-MAINS-CABLE
    description: Mains AC cabling spec
    status: verified
    resolution: 14 AWG 3-conductor SOOW (corrected from initial Belden 8267 spec; RG-213/U is 2-conductor coax and cannot carry L/N/Earth). Belden 8267 retained only for SCR-to-reactor discharge flex link role.

  - id: RES-GATE-PART
    description: Gate driver pulse transformer corrected
    status: verified
    resolution: Coilcraft SD250-3L (was nonexistent VPH4-0190)

  - id: RES-GATE-WIDTH
    description: Gate pulse width corrected
    status: verified
    resolution: 25-40 us (was 80 us; saturated SD250-3L core)

  - id: RES-ELECTRODE-ARCH
    description: Electrode architecture selected (4 candidates evaluated)
    status: verified
    resolution: |
      Architecture 4: graphite puck (17.5mm OD x 8-10mm thick, isotropic high-density) + Cu push rod (C110 OFHC, 10mm OD x 150-250mm).
      Selected over solid Cu rod, solid graphite rod, and Cu rod with replaceable graphite end cap.
      Decoupled contact face from current carrier; carbon-on-carbon-on-carbon interface; simpler 10mm seal vs 17.5mm.
      Puck is sacrificial (2 per shot, ~$2 each, ~30 from a $60 rod).
