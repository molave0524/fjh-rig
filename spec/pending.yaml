  # === Electrode design (Architecture 4: graphite puck + Cu push rod) ===
  # Tracked in dependency order. Q2 recommended first (ripples back to puck spec).

  - id: ELECTRODE-Q1
    description: Select graphite puck stock and grade (POCO EDM-3 / Mersen 2333 / surplus EDM)
    status: open
    priority: medium
    subsystem: reaction-chamber
    notes: Driver is ash content - matters for ICP-MS product purity; otherwise surplus is fine. Affects procurement only, no geometry impact.

  - id: ELECTRODE-Q2
    description: Puck-to-push-rod contact face geometry (flat-on-flat vs. counterbored capture)
    status: open
    priority: high
    subsystem: reaction-chamber
    notes: |
      RECOMMENDED NEXT DECISION. Ripples backward into puck thickness spec.
      Flat-on-flat: simplest machining, max contact area, but puck can cock during reload.
      Counterbored end: ~14mm x 1-2mm recess captures puck rim, prevents cocking, slightly less perimeter contact.
    blocks: [ELECTRODE-Q3, ELECTRODE-puck-batch]

  - id: ELECTRODE-Q3
    description: Push-rod end treatment (bare Cu / bonded graphite disc / threaded graphite tip)
    status: open
    priority: medium
    subsystem: reaction-chamber
    depends_on: ELECTRODE-Q2
    notes: Trade-off is up-front machining time vs. how often you re-face the push rod for arc damage.

  - id: ELECTRODE-Q4
    description: Sliding seal / gland design (PTFE bushing / graphite-impregnated / O-ring + wiper)
    status: open
    priority: high
    subsystem: reaction-chamber
    notes: Substantially simplified by Arch 4 (10mm rod vs 17.5mm working face). Driver is operating atmosphere (argon at atm vs vacuum modes from main spec).
    blocks: ELECTRODE-Q6

  - id: ELECTRODE-Q5
    description: Compression train interface (load cell, lever, pneumatic ram, hand screw)
    status: open
    priority: medium
    subsystem: reaction-chamber
    notes: Now fully decoupled from discharge geometry under Arch 4. Standard mechanical interface; can be addressed independently.

  - id: ELECTRODE-Q6
    description: Tube-end termination housing (caps/seals + push rod entry geometry)
    status: open
    priority: medium
    subsystem: reaction-chamber
    depends_on: ELECTRODE-Q4
    notes: Driver is argon flush vs vacuum pull-down requirements; rebuildable per shot or per N shots.

  - id: ELECTRODE-puck-batch
    description: Cut 30-puck batch from 18mm graphite rod stock once Q1 and Q2 resolved
    status: blocked
    priority: medium
    subsystem: reaction-chamber
    depends_on: [ELECTRODE-Q1, ELECTRODE-Q2]
    notes: ~$60 of stock yields ~30 pucks. Use bandsaw or cutoff wheel; one face per puck only needs lapping if stock face finish insufficient.

  # === Sample prep station (added 2026-05-12 from audit response) ===
  # Documents the parallel prep workflow that makes the 25-30 s cycle achievable.
  # See spec/04b_sample_prep.adoc.

  - id: PREP-Q1
    description: Tube transfer mechanism (manual hand-carry tray vs sliding stage)
    status: open
    priority: medium
    subsystem: sample-prep
    notes: Manual tray recommended for V1 build; sliding stage deferred as FUTURE upgrade.

  - id: PREP-Q2
    description: Compression jig load cell - shared with reaction position or dedicated prep-zone load cell
    status: open
    priority: medium
    subsystem: sample-prep
    notes: Shared simplifies BOM; dedicated allows parallel R-verify during fire.

  - id: PREP-Q3
    description: Prep zone footprint and layout within enclosure
    status: open
    priority: high
    subsystem: sample-prep
    depends_on: GAP-ENCLOSURE-DESIGN
    notes: Two-zone partition design; partition must be conductive and bonded to chassis for EMI containment.

  - id: PREP-Q4
    description: Spent-column extraction and tube cleaning protocol
    status: open
    priority: medium
    subsystem: sample-prep
    notes: Between rotation cycles. Affects tube reuse rate and cross-shot contamination.

  - id: PREP-Q5
    description: Feedstock batch pre-portioning - pre-weighed vials or weigh-per-shot
    status: open
    priority: low
    subsystem: sample-prep
    notes: Pre-weighed vials saves prep time but adds vial inventory; weigh-per-shot is simpler.

  - id: GAP-ENCLOSURE-DESIGN
    description: Outer enclosure design including two-zone partition for parallel prep
    status: open
    priority: high
    subsystem: enclosure
    notes: Drives prep zone footprint (PREP-Q3); covers EMI shielding, interlocks, ventilation, HEPA filtration intersection.

