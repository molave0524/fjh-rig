  - id: FUTURE-FILM-CAPS
    description: Pulse-rated cap upgrade (Vishay 159 PUL-SI / CDE 947D / film)
    status: deferred
    notes: |
      When electrolytic pulse life (~20-50k shots realistic for ALS70 in FJH duty) becomes operationally limiting.
