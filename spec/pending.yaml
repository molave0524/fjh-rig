pending:
  - id: VERIFY-CCPF-LIN
    description: Verify CCPF regulation linearity at 400 V (27% of full scale)
    status: open
    priority: high
    subsystem: charging-supply
    blocks: commissioning

  - id: VERIFY-FUSE-ITT
    description: Measure actual per-cap pulse i2t on first commissioning shots with clip-on current probe
    status: open
    priority: medium
    subsystem: capacitor-bank
    notes: Per-cap fuse spec'd as Mersen A50QS80-4 (~6000 A2s pre-arc) sized for estimated 4500 A2s per-shot pulse. Verify actual value with on-cap probe; can downsize to A50QS50-4 (~2500 A2s) if margin proves generous, saves ~$50 across 14 caps.

  - id: VERIFY-CAP-ESR-BASELINE
    description: Measure per-cap ESR baseline at installation with milliohmmeter/LCR meter
    status: open
    priority: medium
    subsystem: capacitor-bank
    notes: |
      Per spec/02_capacitor_bank.adoc Pulse Life section. Measure each cap's ESR (~13 mOhm datasheet baseline @ 100 Hz / 20 C) before bank assembly. Record in a spreadsheet keyed to cap serial number / position. Re-measure every ~5000 shots or at major service intervals; replace individual caps at 2x baseline, full bank at 1.5x average. Suggested instrument: DER EE DE-5000 LCR meter or equivalent.

  - id: VERIFY-CCPF-RATE
